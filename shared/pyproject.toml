[project]
name = "shared"
version = "0.1.0"
description = "Shared infrastructure for NeoMarket services — auth, db, outbox, inbox, http-clients, errors"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.10",
    "bcrypt>=4.2",
    "httpx>=0.28",
    "starlette>=0.27",
]

[dependency-groups]
dev = [
    "anyio>=4.9.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14.0",
    "ruff>=0.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]

[tool.pytest.ini_options]
addopts = ["-p", "no:debugging"]
asyncio_mode = "auto"
