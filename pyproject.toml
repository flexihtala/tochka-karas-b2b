[project]
name = "tochka-karas-platform"
version = "0.1.0"
description = "NeoMarket monorepo — b2b + moderation + b2c"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "b2b", "moderation"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
