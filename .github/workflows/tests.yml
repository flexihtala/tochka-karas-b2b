name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: install_uv
        run: |
          pip install uv
          uv sync --all-packages --all-extras
      - name: ruff
        run: uv run ruff check .

  test-shared:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: install_uv
        run: |
          pip install uv
          uv sync --all-packages --all-extras
      - name: test shared
        working-directory: ./shared
        run: uv run pytest tests -v

  test-b2b:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./b2b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: install_uv
        run: |
          pip install uv
          uv sync --all-packages --all-extras
      - name: test b2b
        run: |
          uv run pytest \
            --cov=. \
            --no-cov-on-fail \
            --junitxml=report.xml \
            --cov-report=xml:coverage.xml \
            --cov-report=term .
